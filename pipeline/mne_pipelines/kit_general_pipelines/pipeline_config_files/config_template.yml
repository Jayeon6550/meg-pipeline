project:
  # Dataset folder name under the root path
  name: "script-testing-dataset"

  # Where the dataset root comes from:
  # - If root_override is null, read from this env var.
  root_env: "MEG_DATA" # This environment variable should hold the path that contains your dataset
  root_override: null # e.g., "/mnt/meg" to bypass the env var

subjects:
  # If empty (or missing), process ALL subjects found in the BIDS root
  include: ["test1", "test2", "test3"]
  # Always skip these (useful to omit pilot/bad subs)
  exclude: []

# Optional selection filters (empty => all)
bids_selection:
  sessions: [] # e.g., ["01", "02"]
  tasks: [] # e.g., ["language"]
  runs: [] # e.g., [1, 2]
  splits: [] # e.g., ["01","02"] to constrain splits
  processings: []

filters: # Used when executing kit_apply_filters.py
  notch:
    enabled: true # default: true
    # freqs: [50, 100, 150]  # optional explicit list; if omitted we use harmonics of C.LINE_FREQUENCY up to Nyquist
    # kwargs:               # optional extra args passed to raw.notch_filter
    #   notch_widths: 2.0

  bandpass:
    l_freq: 1.0 # default: 1.0 Hz
    h_freq: 100.0 # default: 40.0 Hz
    # kwargs:              # optional extra args passed to raw.filter
    #   method: fir
    #   phase: zero
    #   fir_window: hamming

events: # Used when executing kit_compute_events_single_channel.py
  desc: autopulses # must match the desc used when writing .eve (default: autopulses)

epoching: # Used when executing kit_evoked_response_single_channel.py
  # Global defaults (used when an event code is not listed below)
  tmin: -0.2
  tmax: 0.8
  baseline: [-0.2, 0.0]
  preload: true
  picks: [] # e.g., ["meg"], ["mag"]; leave empty for all MEG
  decim:
  reject: # e.g., {"mag": 4e-12}
  flat:

  # Per-event-type overrides (keys are event codes as written in .eve)
  windows:
    "224":
      tmin: -0.1
      tmax: 0.5
      baseline: [-0.1, 0.0]
    "231":
      tmin: -0.3
      tmax: 0.7
      # baseline omitted => uses global baseline

plots:
  save_stim_plots: true # default true; set to false to disable saving
  # Below parameters are optional and should not be present in your config unless you need to change those for a valid reason
  format: pdf # pdf|png|svg
  duration_s: 10.0 # window duration, defaults to C.DEFAULT_TIME_SCALE
  misc_scaling: 1.0 # defaults to C.DEFAULT_MISC_CHANNELS_AMPLITUDE_SCALE
  channels_mne: # defaults to C.trigger_channels_MNE (meaning, plots all trigger channels) if omitted
    - MISC 1
    - MISC 2
    - MISC 3
  subdir: figures # saved under derivatives/triggers_to_events/.../figures

